name: Build release ZIP
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build ZIP
        run: |
          mkdir -p dist/glpiautoassign
          rsync -a --exclude='.git' --exclude='dist' --exclude='.github' ./ dist/glpiautoassign/
          cd dist
          zip -r "../glpi-autoassign-${{ steps.version.outputs.version }}.zip" glpiautoassign
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: glpi-autoassign-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
